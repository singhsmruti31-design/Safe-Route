<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Blue Shield Background -->
  <path d="M16 2 C22.8 2 27.5 4.5 27.5 10 C27.5 19 21.5 25.5 16 29.5 C10.5 25.5 4.5 19 4.5 10 C4.5 4.5 9.2 2 16 2 Z"
        fill="url(#shieldGrad)"
        filter="url(#subtleGlow)" />

  <!-- Shield Inner Border Highlight for crispness at 16x16 -->
  <path d="M16 3.5 C21.8 3.5 26 5.6 26 10.2 C26 18 20.8 23.8 16 27.5 C11.2 23.8 6 18 6 10.2 C6 5.6 10.2 3.5 16 3.5 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.25"
        stroke-width="0.8" />

  <!-- White Location Pin (Safety Symbol) -->
  <path d="M16 7.5 C13 7.5 10.5 9.9 10.5 12.8 C10.5 17 16 22.2 16 22.2 C16 22.2 21.5 17 21.5 12.8 C21.5 9.9 19 7.5 16 7.5 Z"
        fill="#FFFFFF" />

  <!-- Pin Center Dot in Arctic Blue -->
  <circle cx="16" cy="12.8" r="2.2" fill="#2563EB" />
</svg>